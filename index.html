<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ensamblador de PC</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <h1>ENSAMBLADOR DE PC</h1>
        <p>Simulador de partes de la computadora</p>
    </header>

    <section class="contenedor">

        <div class="tarjeta" onclick="mostrarInfo('fuente')">
            <img src="img/fuente.jpg" alt="">
            <h3>Fuente de Poder</h3>
        </div>

        <div class="tarjeta" onclick="mostrarInfo('placa')">
            <img src="img/placa.jpg" alt="">
            <h3>Placa Base</h3>
        </div>

        <div class="tarjeta" onclick="mostrarInfo('ram')">
            <img src="img/ram.jpg" alt="">
            <h3>Memoria RAM</h3>
        </div>

        <div class="tarjeta" onclick="mostrarInfo('disco')">
            <img src="img/disco.jpg" alt="">
            <h3>Disco Duro</h3>
        </div>

        <div class="tarjeta" onclick="mostrarInfo('cables')">
            <img src="img/cables.jpg" alt="">
            <h3>Cables SATA</h3>
        </div>

        <div class="tarjeta" onclick="mostrarInfo('gabinete')">
            <img src="img/gabinete.jpg" alt="">
            <h3>Gabinete</h3>
        </div>

    </section>

    <div class="info" id="info">
        <h2>Información</h2>
        <p id="texto"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
